<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre-se - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="coluna-esquerda">
            <h2>Crie sua conta e começe a aprender hoje!</h2>
            <img src="img/tela-inicial.png" alt="menina-estudando">
        </section>
        <section class="coluna-direita">
            <div class="form-box" id="login-form">
                <form>
                    <h2>Iniciar sessão</h2>
                    <p>Faça login para continuar aprendendo</p>
                    <input type="email" name="email" placeholder="E-mail" required>
                    <input type="password" name="password" placeholder="Senha" required>
                    <button type="submit" name="login">Entrar</button>
                    <p>Não tem uma conta? <a href="#" onclick="mostrarForm('register-form')">Criar conta</a></p>
                </form>
            </div>
            <div class="form-box" id="register-form">
                <form></form>
                    <h2>Cadastre-se</h2>
                    <p>Crie sua conta no aprenda+ e inicie sua jornada de aprendizado.</p>
                    <input type="text" name="name" placeholder="Nome Completo" required>
                    <input type="email" name="email" placeholder="E-mail" required>
                    <input type="password" name="password" placeholder="Crie uma senha" required>
                    <input type="password" name="confirmar" placeholder="Confirme sua senha">
                    <button type="submit" name="register">Cadastre-se</button>
                    <p>Já tem uma conta? <a href="#" onclick="mostrarForm('login-form')">Entrar</a></p>
                </form>
            </div>
            <a href="index.html">Voltar a página principal</a>
        </section>
    </main>
</body>
</html>
